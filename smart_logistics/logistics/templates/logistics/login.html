{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SmartLogix</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">📦</div>
      <h1 class="login-title">SmartLogix</h1>
      <p class="login-subtitle">Smart Logistics Platform</p>
    </div>

    {% if messages %}
    <div class="messages" style="margin-bottom:16px;">
      {% for message in messages %}
      <div class="message message-{{ message.tags }}">
        {% if message.tags == 'error' %}✕{% else %}ℹ{% endif %} {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="login-card">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-input" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:24px;">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary login-btn">
          Sign In →
        </button>
      </form>
    </div>

    <div class="login-hint">
      Secure access · SmartLogix Platform v1.0
    </div>
  </div>
</div>
</body>
</html>
